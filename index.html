<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Navya 💜</title>
<style>
:root{--pink:#ffb6d5;--purple:#cbb5ff;--deep:#170d24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
background:radial-gradient(circle at top,#44254f 0,#1b1028 48%,#08070d 100%);
display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}
.panel{animation:panelIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.float-heart{position:fixed;bottom:-50px;z-index:0;pointer-events:none;animation:floatUp linear forwards;opacity:.8}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg) scale(.7);opacity:0}15%{opacity:.85}100%{transform:translateY(-115vh) rotate(28deg) scale(1.3);opacity:0}}
.photo-pop{animation:photoPop .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes photoPop{from{opacity:0;transform:scale(.92) rotate(-2deg);filter:blur(3px)}to{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}}
@keyframes glow{0%,100%{box-shadow:0 12px 30px #0007,0 0 0 #ffb6d500}50%{box-shadow:0 12px 30px #0007,0 0 24px #ffb6d577}}
.frame{animation:glow 3s ease-in-out infinite}
button{transition:transform .2s ease,box-shadow .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 6px 20px #ffb6d555}
.sparkles{position:fixed;inset:0;pointer-events:none;opacity:.65;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:39px 39px}
.panel{position:relative;width:min(100%,430px);text-align:center;padding:26px 20px 24px;border:1px solid #ffffff2c;border-radius:28px;background:#ffffff12;box-shadow:0 22px 70px #0008;backdrop-filter:blur(10px)}
.hidden{display:none!important}
.heart{font-size:48px;animation:beat 1.5s infinite}
h1{font-size:clamp(27px,7vw,37px);line-height:1.15;margin:12px 0;color:#ffe1ef}
p{color:#f4e9f8;line-height:1.55}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff55;background:#fff;color:#24142f;font-size:17px;text-align:center;margin:12px 0}
button{border:0;border-radius:999px;padding:13px 20px;margin:5px;background:linear-gradient(100deg,#ffd1e6,#d9c8ff);color:#31153b;font-size:15px;font-weight:750;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.error{min-height:22px;color:#ffc4d8;font-size:14px}
.frame{background:#fff;color:#2a2030;padding:12px 12px 18px;transform:rotate(-1.5deg);box-shadow:0 12px 30px #0007;margin:20px auto 16px;max-width:330px}
.frame img{display:block;width:100%;height:360px;object-fit:cover;background:#eee}
.caption{font-family:Georgia,serif;font-size:22px;margin-top:13px;color:#433047}
.count{font-size:13px;color:#ead9f2}
.message{font-size:18px;color:#ffe1ef;font-weight:700}
.tiny{font-size:12px;opacity:.75}
@keyframes beat{50%{transform:scale(1.12)}}
@media(max-height:740px){.panel{padding:18px 16px}.frame img{height:290px}}
</style>
</head>
<body>
<div class="sparkles"></div>
<main class="panel" id="lock">
 <div class="heart">💜</div>
 <h1>A Special Surprise</h1>
 <p>A little birthday surprise for Navya is waiting ✨</p>
 <input id="pass" type="password" placeholder="Enter password" autocomplete="off" aria-label="Password">
 <button id="openBtn">🔓 Open Surprise</button>
 <div class="error" id="err" role="status"></div>
 <p class="tiny">Hint: ask the person who made this surprise 💌</p>
</main>
<main class="panel hidden" id="show">
 <div class="heart">💗</div>
 <h1>Happy Birthday, Navya! 🎂</h1>
 <p class="message">Happy Birthday to my ♾️ Infinity 💜</p>
 <div class="frame">
   <img id="pic" alt="Birthday memory">
   <div class="caption" id="caption">A lovely memory ♡</div>
 </div>
 <div class="count" id="count">Memory 1 of 2</div>
 <div>
  <button id="prev" disabled>← Previous</button>
  <button id="next">Next memory →</button>
 </div>
 <p id="closing" class="hidden">May your day be full of smiles, happiness, and beautiful memories. 💜✨</p>
</main>

];
const captions = ["A lovely memory ♡", "Keep smiling and shining ✨"];
let index = 0;
const $ = id => document.getElementById(id);
function makeFloatingHeart(){
  const heart = document.createElement("span");
  heart.className = "float-heart";
  heart.textContent = ["💜","💗","♡","✨","💕"][Math.floor(Math.random()*5)];
  heart.style.left = (Math.random()*100) + "vw";
  heart.style.fontSize = (16 + Math.random()*22) + "px";
  heart.style.animationDuration = (5 + Math.random()*5) + "s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(), 10500);
}
setInterval(makeFloatingHeart, 650);
function unlock(){
  if($("pass").value === PASSWORD){
    $("lock").classList.add("hidden");
    $("show").classList.remove("hidden");
    render();
  } else {
    $("err").textContent = "That password didn't match. Try again 💜";
    $("pass").focus();
  }
}
function render(){
  $("pic").classList.remove("photo-pop");
  void $("pic").offsetWidth;
  $("pic").classList.add("photo-pop");
  $("pic").src = photos[index];
  $("caption").textContent = captions[index];
  $("count").textContent = `Memory ${index+1} of ${photos.length}`;
  $("prev").disabled = index === 0;
  $("next").textContent = index === photos.length-1 ? "One last wish 💌" : "Next memory →";
  $("closing").classList.add("hidden");
}
$("openBtn").addEventListener("click",unlock);
$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
$("prev").addEventListener("click",()=>{if(index>0){index--;render()}});
$("next").addEventListener("click",()=>{
 if(index<photos.length-1){index++;render()}
 else {
   $("closing").classList.remove("hidden");
   $("next").textContent="💜 Happy Birthday";
   for(let i=0;i<18;i++) setTimeout(makeFloatingHeart, i*90);
 }
});
</script>
